<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UfficioCal</title>
  <style>
    :root {
      --bg: #070d1a;
      --card: #0f172a;
      --card-2: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #2563eb;
      --danger: #dc2626;
      --ok: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .screen { display: none; }
    .screen.active { display: block; }

    /* Login */
    #loginScreen.active {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .login-card h1 { font-size: 1.7rem; margin-bottom: 6px; }
    .login-card p { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 5px; }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 9px 11px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 0.92rem;
    }

    /* App Layout */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 22px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .topbar-left h2 { font-size: 1.25rem; }
    .topbar-left span { font-size: 0.82rem; color: var(--muted); }
    .topbar-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    .btn {
      border: none;
      border-radius: 9px;
      padding: 8px 13px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: var(--card-2);
    }
    .btn:hover { filter: brightness(1.08); }
    .btn-primary { background: var(--accent); }
    .btn-danger { background: var(--danger); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); }

    .main-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 18px;
      padding: 18px 22px;
      max-width: 1440px;
      margin: 0 auto;
    }
    @media (max-width: 960px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 10px;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .dow {
      text-align: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      padding-bottom: 4px;
    }
    .day-cell {
      min-height: 92px;
      background: rgba(30,41,59,0.55);
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: 10px;
      padding: 7px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .day-cell.empty { background: transparent; border-color: transparent; }
    .day-cell.today { border-color: #38bdf8; }
    .day-num { font-size: 0.82rem; font-weight: 700; }

    .ev-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
    }
    .ev-badge.green { background: #15803d; }
    .ev-badge.amber { background: #b45309; }
    .ev-badge.red { background: #b91c1c; }
    .ev-badge.purple { background: #6d28d9; }

    .ev-del-mini {
      background: rgba(0,0,0,0.35);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.7rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .ev-del-mini:hover { background: #dc2626; }

    .side-stack { display: flex; flex-direction: column; gap: 16px; }
    .event-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 10px;
      background: var(--card-2);
      border: 1px solid var(--border);
    }
    .event-item-title { font-weight: 700; font-size: 0.88rem; }
    .event-item-meta { font-size: 0.76rem; color: var(--muted); }

    /* Modal nuovo impegno */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2,6,23,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 500;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .ai-msgs {
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 10px 0;
    }
    .ai-msg { padding: 8px 10px; border-radius: 8px; font-size: 0.83rem; background: var(--card-2); }
    .ai-msg.user { border-left: 3px solid #38bdf8; }
    .ai-msg.bot { border-left: 3px solid #4ade80; }
  </style>
</head>
<body>

  <!-- SCHERMATA LOGIN -->
  <section id="loginScreen" class="screen active">
    <div class="login-card">
      <h1>UfficioCal</h1>
      <p>Accesso condiviso del team con salvataggio persistente.</p>
      <form id="loginForm">
        <div class="field">
          <label for="loginName">Nome (opzionale)</label>
          <input id="loginName" type="text" placeholder="Es. Matteo" />
        </div>
        <div class="field">
          <label for="loginEmail">Email ufficio</label>
          <input id="loginEmail" type="email" placeholder="nome@azienda.it" required />
        </div>
        <div class="field">
          <label for="loginPass">Password condivisa</label>
          <input id="loginPass" type="password" placeholder="Password" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Entra in UfficioCal</button>
      </form>
    </div>
  </section>

  <!-- SCHERMATA PRINCIPALE -->
  <section id="appScreen" class="screen">
    <header class="topbar">
      <div class="topbar-left">
        <h2 id="welcomeTitle">UfficioCal</h2>
        <span id="userBadge">Profilo attivo</span>
      </div>
      <div class="topbar-actions">
        <button id="todayBtn" type="button" class="btn btn-ghost">Oggi</button>
        <button id="monthBtn" type="button" class="btn">Mese</button>
        <button id="weekBtn" type="button" class="btn">Settimana</button>
        <button id="openNewEventBtn" type="button" class="btn btn-primary">+ Nuovo impegno</button>
        <button id="logoutBtn" type="button" class="btn btn-danger">Esci</button>
      </div>
    </header>

    <main class="main-grid">
      <section class="panel">
        <div class="cal-header">
          <button id="prevBtn" type="button" class="btn">‹ Prec</button>
          <h3 id="periodLabel">Mese</h3>
          <button id="nextBtn" type="button" class="btn">Succ ›</button>
        </div>
        <div id="calGrid" class="cal-grid"></div>
      </section>

      <aside class="side-stack">
        <div class="panel">
          <h3 style="margin-bottom:10px;">Impegni salvati (<span id="eventsCount">0</span>)</h3>
          <div id="eventsList" style="display:flex;flex-direction:column;gap:8px;"></div>
        </div>

        <div class="panel">
          <h3>Assistente AI</h3>
          <div id="aiMsgs" class="ai-msgs"></div>
          <form id="aiForm" style="display:flex;gap:8px;">
            <input id="aiInput" type="text" placeholder="Chiedi qualcosa sugli impegni..." style="flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card-2);color:#fff;" />
            <button type="submit" class="btn btn-primary">Invia</button>
          </form>
        </div>
      </aside>
    </main>
  </section>

  <!-- MODALE NUOVO IMPEGNO -->
  <div id="eventModal" class="modal-backdrop">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h3>Nuovo impegno</h3>
        <button id="closeModalBtn" type="button" class="btn btn-ghost">✕</button>
      </div>
      <form id="eventForm">
        <div class="field">
          <label for="evTitle">Titolo</label>
          <input id="evTitle" type="text" placeholder="Es. Riunione team" required />
        </div>
        <div class="row-2">
          <div class="field">
            <label for="evDate">Data</label>
            <input id="evDate" type="date" required />
          </div>
          <div class="field">
            <label for="evColor">Colore</label>
            <select id="evColor">
              <option value="blue">Blu</option>
              <option value="green">Verde</option>
              <option value="amber">Ambra</option>
              <option value="red">Rosso</option>
              <option value="purple">Viola</option>
            </select>
          </div>
        </div>
        <div class="row-2">
          <div class="field">
            <label for="evStart">Ora inizio</label>
            <input id="evStart" type="time" value="09:00" required />
          </div>
          <div class="field">
            <label for="evEnd">Ora fine</label>
            <input id="evEnd" type="time" value="10:00" required />
          </div>
        </div>
        <div class="field">
          <label for="evEmails">Email destinatari avviso (separate da virgola)</label>
          <input id="evEmails" type="text" placeholder="membro@azienda.it" />
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;">
          <button type="button" id="cancelModalBtn" class="btn btn-ghost">Annulla</button>
          <button type="submit" class="btn btn-primary">Salva impegno</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SHARED_PASS = 'ufficio2026';
    const SESSION_KEY = 'ufficiocal_user_v2';
    const $ = id => document.getElementById(id);

    const state = {
      user: null,
      users: [],
      events: [],
      sentEmails: [],
      view: 'month',
      cursor: new Date()
    };

    function toIso(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function saveSession() {
      try {
        if (state.user && state.user.email) {
          sessionStorage.setItem(SESSION_KEY, JSON.stringify(state.user));
        } else {
          sessionStorage.removeItem(SESSION_KEY);
        }
      } catch (_) {}
    }

    function loadSession() {
      try {
        const raw = sessionStorage.getItem(SESSION_KEY);
        if (raw) {
          const u = JSON.parse(raw);
          if (u && u.email) state.user = u;
        }
      } catch (_) {}
    }

    function syncScreen() {
      saveSession();
      const logged = Boolean(state.user && state.user.email);
      $('loginScreen').classList.toggle('active', !logged);
      $('appScreen').classList.toggle('active', logged);
      if (logged) {
        $('welcomeTitle').textContent = `UfficioCal — ${state.user.name || state.user.email}`;
        $('userBadge').textContent = `${state.user.email} · Attivo`;
        renderAll();
      }
    }

    async function fetchServerState() {
      try {
        const r = await fetch('/api/state', { cache: 'no-store' });
        const d = await r.json().catch(() => ({}));
        if (Array.isArray(d.users)) state.users = d.users;
        if (Array.isArray(d.events)) state.events = d.events;
        if (Array.isArray(d.sentEmails)) state.sentEmails = d.sentEmails;
        if (state.user) renderAll();
      } catch (_) {}
    }

    async function deleteEvent(evId) {
      const cleanId = String(evId || '').trim();
      if (!cleanId) return;
      try {
        let r = await fetch('/api/events/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          cache: 'no-store',
          body: JSON.stringify({ id: cleanId })
        });
        let j = await r.json().catch(() => ({}));
        if (!r.ok || !j.ok) {
          r = await fetch('/api/events/' + encodeURIComponent(cleanId), {
            method: 'DELETE',
            cache: 'no-store'
          });
          j = await r.json().catch(() => ({}));
        }
        if (r.ok && j.ok) {
          state.events = Array.isArray(j.events)
            ? j.events
            : state.events.filter(e => String(e.id) !== cleanId);
          renderAll();
        }
      } catch (_) {}
    }

    function renderCalendar() {
      const grid = $('calGrid');
      grid.innerHTML = '';
      ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'].forEach(d => {
        const el = document.createElement('div');
        el.className = 'dow';
        el.textContent = d;
        grid.appendChild(el);
      });

      const todayIso = toIso(new Date());
      const cur = new Date(state.cursor);
      let days = [];

      if (state.view === 'month') {
        $('periodLabel').textContent = cur.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });
        const first = new Date(cur.getFullYear(), cur.getMonth(), 1);
        const last = new Date(cur.getFullYear(), cur.getMonth() + 1, 0);
        const offset = (first.getDay() + 6) % 7;
        for (let i = 0; i < offset; i++) days.push(null);
        for (let d = 1; d <= last.getDate(); d++) {
          days.push(new Date(cur.getFullYear(), cur.getMonth(), d));
        }
      } else {
        const offset = (cur.getDay() + 6) % 7;
        const mon = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() - offset);
        const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
        $('periodLabel').textContent = `${mon.toLocaleDateString('it-IT', { day: '2-digit', month: 'short' })} - ${sun.toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric' })}`;
        for (let i = 0; i < 7; i++) {
          days.push(new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i));
        }
      }

      days.forEach(dt => {
        const cell = document.createElement('div');
        if (!dt) {
          cell.className = 'day-cell empty';
          grid.appendChild(cell);
          return;
        }
        const iso = toIso(dt);
        cell.className = 'day-cell' + (iso === todayIso ? ' today' : '');

        const num = document.createElement('div');
        num.className = 'day-num';
        num.textContent = String(dt.getDate());
        cell.appendChild(num);

        const dayEvents = (state.events || []).filter(ev => ev && ev.date === iso);
        dayEvents.forEach(ev => {
          const badge = document.createElement('div');
          badge.className = 'ev-badge ' + (ev.color || 'blue');

          const label = document.createElement('span');
          label.style.overflow = 'hidden';
          label.style.textOverflow = 'ellipsis';
          label.style.whiteSpace = 'nowrap';
          label.textContent = `${ev.startTime || ''} ${ev.title || ''}`.trim();

          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'ev-del-mini';
          delBtn.textContent = '✕';
          delBtn.title = 'Elimina impegno';
          delBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            delBtn.disabled = true;
            await deleteEvent(ev.id);
          });

          badge.appendChild(label);
          badge.appendChild(delBtn);
          cell.appendChild(badge);
        });

        cell.addEventListener('click', () => {
          $('evDate').value = iso;
          $('eventModal').classList.add('open');
        });

        grid.appendChild(cell);
      });
    }

    function renderEventsList() {
      const list = $('eventsList');
      const events = Array.isArray(state.events) ? state.events : [];
      $('eventsCount').textContent = String(events.length);
      list.innerHTML = '';

      if (!events.length) {
        list.innerHTML = '<div style="font-size:0.84rem;color:var(--muted);">Nessun impegno salvato.</div>';
        return;
      }

      events.forEach(ev => {
        const row = document.createElement('div');
        row.className = 'event-item';

        const info = document.createElement('div');
        info.innerHTML = `<div class="event-item-title">${ev.title || 'Impegno'}</div><div class="event-item-meta">${ev.date || ''} · ${ev.startTime || ''}-${ev.endTime || ''}</div>`;

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'btn btn-danger';
        delBtn.textContent = 'Elimina';
        delBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          delBtn.disabled = true;
          delBtn.textContent = '...';
          await deleteEvent(ev.id);
        });

        row.appendChild(info);
        row.appendChild(delBtn);
        list.appendChild(row);
      });
    }

    function renderAll() {
      renderCalendar();
      renderEventsList();
    }

    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pass = $('loginPass').value.trim();
      if (pass !== SHARED_PASS) {
        alert('Password condivisa non valida.');
        return;
      }
      const email = $('loginEmail').value.trim().toLowerCase();
      const name = $('loginName').value.trim() || email.split('@')[0];
      state.user = { email, name };
      syncScreen();
      await fetch('/api/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ activeUser: state.user })
      }).catch(() => {});
      await fetchServerState();
    });

    $('logoutBtn').addEventListener('click', () => {
      state.user = null;
      syncScreen();
    });

    $('todayBtn').addEventListener('click', () => {
      state.cursor = new Date();
      renderCalendar();
    });
    $('monthBtn').addEventListener('click', () => {
      state.view = 'month';
      renderCalendar();
    });
    $('weekBtn').addEventListener('click', () => {
      state.view = 'week';
      renderCalendar();
    });
    $('prevBtn').addEventListener('click', () => {
      if (state.view === 'month') {
        state.cursor = new Date(state.cursor.getFullYear(), state.cursor.getMonth() - 1, 1);
      } else {
        state.cursor = new Date(state.cursor.getFullYear(), state.cursor.getMonth(), state.cursor.getDate() - 7);
      }
      renderCalendar();
    });
    $('nextBtn').addEventListener('click', () => {
      if (state.view === 'month') {
        state.cursor = new Date(state.cursor.getFullYear(), state.cursor.getMonth() + 1, 1);
      } else {
        state.cursor = new Date(state.cursor.getFullYear(), state.cursor.getMonth(), state.cursor.getDate() + 7);
      }
      renderCalendar();
    });

    $('openNewEventBtn').addEventListener('click', () => {
      $('evDate').value = toIso(new Date());
      $('eventModal').classList.add('open');
    });
    $('closeModalBtn').addEventListener('click', () => $('eventModal').classList.remove('open'));
    $('cancelModalBtn').addEventListener('click', () => $('eventModal').classList.remove('open'));

    $('eventForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        id: 'ev_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        title: $('evTitle').value.trim(),
        date: $('evDate').value,
        startTime: $('evStart').value,
        endTime: $('evEnd').value,
        color: $('evColor').value,
        emails: $('evEmails').value.split(',').map(x => x.trim().toLowerCase()).filter(Boolean),
        createdBy: state.user?.email || ''
      };

      const resp = await fetch('/api/events', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await resp.json().catch(() => ({}));
      if (resp.ok && data.ok) {
        state.events = Array.isArray(data.events) ? data.events : [payload, ...state.events];
        if (payload.emails.length) {
          fetch('/api/send-email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              to: payload.emails,
              subject: `Nuovo impegno: ${payload.title}`,
              eventTitle: payload.title,
              html: `<p><strong>${payload.title}</strong> — ${payload.date} (${payload.startTime} - ${payload.endTime})</p>`
            })
          }).catch(() => {});
        }
        $('eventForm').reset();
        $('eventModal').classList.remove('open');
        renderAll();
      }
    });

    $('aiForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = $('aiInput').value.trim();
      if (!text) return;
      $('aiInput').value = '';

      const uDiv = document.createElement('div');
      uDiv.className = 'ai-msg user';
      uDiv.textContent = text;
      $('aiMsgs').appendChild(uDiv);

      const bDiv = document.createElement('div');
      bDiv.className = 'ai-msg bot';
      bDiv.textContent = 'Sto pensando...';
      $('aiMsgs').appendChild(bDiv);

      try {
        const r = await fetch('/api/ai', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: text,
            systemInstruction: `Sei l'assistente di UfficioCal. Eventi attuali: ${JSON.stringify(state.events)}`
          })
        });
        const j = await r.json().catch(() => ({}));
        bDiv.textContent = j.reply || j.error || 'Nessuna risposta.';
      } catch (err) {
        bDiv.textContent = 'Errore AI: ' + err.message;
      }
    });

    loadSession();
    syncScreen();
    fetchServerState();
  </script>
</body>
</html>
