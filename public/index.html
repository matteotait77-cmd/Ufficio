<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UfficioCal</title>
  <style>
    :root {
      --bg: #070d1a;
      --card: #0f172a;
      --card-2: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #2563eb;
      --danger: #dc2626;
      --ok: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    section#loginScreen {
      display: none;
    }
    section#loginScreen.active {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--bg);
    }

    section#appScreen {
      display: none;
    }
    section#appScreen.active {
      display: block;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.55);
    }
    .login-card h1 { font-size: 1.75rem; margin-bottom: 6px; }
    .login-card p { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; line-height: 1.4; }
    .field { margin-bottom: 13px; }
    .field label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 5px; }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 9px 11px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 0.9rem;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 22px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .topbar-left h2 { font-size: 1.25rem; }
    .topbar-left span { font-size: 0.82rem; color: var(--muted); }
    .topbar-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

    .btn {
      border: none;
      border-radius: 9px;
      padding: 8px 12px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: var(--card-2);
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-primary { background: var(--accent); }
    .btn-danger { background: var(--danger); }
    .btn-success { background: var(--ok); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); }
    .btn-sm { padding: 5px 9px; font-size: 0.76rem; border-radius: 7px; }

    .main-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 18px;
      padding: 18px 22px;
      max-width: 1480px;
      margin: 0 auto;
    }
    @media (max-width: 980px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 10px;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .dow {
      text-align: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      padding-bottom: 4px;
    }
    .day-cell {
      min-height: 94px;
      background: rgba(30,41,59,0.55);
      border: 1px solid rgba(148,163,184,0.18);
      border-radius: 10px;
      padding: 7px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
    }
    .day-cell.empty { background: transparent; border-color: transparent; cursor: default; }
    .day-cell.today { border-color: #38bdf8; }
    .day-num { font-size: 0.82rem; font-weight: 700; }

    .ev-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
    }
    .ev-badge.green { background: #15803d; }
    .ev-badge.amber { background: #b45309; }
    .ev-badge.red { background: #b91c1c; }
    .ev-badge.purple { background: #6d28d9; }

    .ev-del-mini {
      background: rgba(0,0,0,0.35);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.7rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    .ev-del-mini:hover { background: #dc2626; }

    .side-stack { display: flex; flex-direction: column; gap: 16px; }
    .event-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border-radius: 10px;
      background: var(--card-2);
      border: 1px solid var(--border);
    }
    .event-item-title { font-weight: 700; font-size: 0.88rem; }
    .event-item-meta { font-size: 0.75rem; color: var(--muted); }
    .event-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .radio-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 8px;
      font-size: 0.82rem;
    }
    .radio-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--text);
    }

    .picker-box {
      max-height: 105px;
      overflow-y: auto;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .alerts-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      margin-top: 6px;
    }
    .alert-row {
      display: grid;
      grid-template-columns: 64px 1fr 1fr;
      gap: 6px;
      align-items: center;
      font-size: 0.78rem;
    }

    .mail-log {
      max-height: 130px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }
    .mail-row {
      font-size: 0.75rem;
      color: var(--muted);
      background: var(--card-2);
      padding: 6px 8px;
      border-radius: 7px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2,6,23,0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 500;
      overflow-y: auto;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      max-height: 92vh;
      overflow-y: auto;
    }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* Pallino AI + Popup */
    #aiBubbleBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      color: #fff;
      border: 2px solid #93c5fd;
      font-weight: 800;
      font-size: 0.92rem;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(0,0,0,0.55);
      z-index: 900;
      display: none;
      align-items: center;
      justify-content: center;
    }
    #aiBubbleBtn.visible { display: flex; }

    #aiPopup {
      position: fixed;
      bottom: 86px;
      right: 20px;
      width: 350px;
      max-width: calc(100vw - 32px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.7);
      z-index: 910;
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    #aiPopup.open { display: flex; }

    .ai-msgs {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .ai-msg {
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      background: var(--card-2);
      white-space: pre-wrap;
    }
    .ai-msg.user { border-left: 3px solid #38bdf8; }
    .ai-msg.bot { border-left: 3px solid #4ade80; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <section id="loginScreen" class="active">
    <div class="login-card">
      <h1>UfficioCal</h1>
      <p>Registrazione e accesso condiviso: ogni persona che si logga resta salvata con il proprio profilo e riceve gli alert configurati.</p>
      <form id="loginForm">
        <div class="field">
          <label for="loginName">Nome (opzionale, ricavato anche dall'email)</label>
          <input id="loginName" type="text" placeholder="Es. Matteo" />
        </div>
        <div class="field">
          <label for="loginEmail">Email personale / ufficio</label>
          <input id="loginEmail" type="email" placeholder="nome@azienda.it" required />
        </div>
        <div class="field">
          <label for="loginPass">Password condivisa</label>
          <input id="loginPass" type="password" placeholder="Inserisci password" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Entra e salva profilo</button>
      </form>
    </div>
  </section>

  <!-- APP -->
  <section id="appScreen">
    <header class="topbar">
      <div class="topbar-left">
        <h2 id="welcomeTitle">UfficioCal</h2>
        <span id="userBadge">Profilo attivo</span>
      </div>
      <div class="topbar-actions">
        <button id="todayBtn" type="button" class="btn btn-ghost">Oggi</button>
        <button id="monthBtn" type="button" class="btn">Mese</button>
        <button id="weekBtn" type="button" class="btn">Settimana</button>
        <button id="openNewEventBtn" type="button" class="btn btn-primary">+ Nuovo impegno &amp; Alert</button>
        <button id="logoutBtn" type="button" class="btn btn-danger">Esci</button>
      </div>
    </header>

    <main class="main-grid">
      <section class="panel">
        <div class="cal-header">
          <button id="prevBtn" type="button" class="btn">‹ Prec</button>
          <h3 id="periodLabel">Mese</h3>
          <button id="nextBtn" type="button" class="btn">Succ ›</button>
        </div>
        <div id="calGrid" class="cal-grid"></div>
      </section>

      <aside class="side-stack">
        <div class="panel">
          <h3 style="margin-bottom:10px;">Impegni salvati (<span id="eventsCount">0</span>)</h3>
          <div id="eventsList" style="display:flex;flex-direction:column;gap:8px;"></div>
        </div>

        <div class="panel">
          <h3 style="margin-bottom:8px;">Invio rapido mail &amp; Stato invii</h3>
          <form id="quickMailForm">
            <div class="radio-row">
              <label><input type="radio" name="qmMode" value="all" checked /> Tutti gli utenti registrati</label>
              <label><input type="radio" name="qmMode" value="selected" /> Solo indirizzi inseriti</label>
            </div>
            <div class="field">
              <label for="quickMailTo">Destinatari (separati da virgola)</label>
              <input id="quickMailTo" type="text" placeholder="email1@azienda.it, email2@azienda.it" />
            </div>
            <div class="field">
              <label for="quickMailSubject">Oggetto</label>
              <input id="quickMailSubject" type="text" placeholder="Avviso UfficioCal" />
            </div>
            <div class="field">
              <label for="quickMailBody">Messaggio</label>
              <textarea id="quickMailBody" rows="2" placeholder="Testo dell'avviso..."></textarea>
            </div>
            <button type="submit" class="btn btn-success" style="width:100%;">Invia email ora</button>
          </form>
          <div id="quickMailStatus" style="font-size:0.78rem;margin-top:6px;color:#38bdf8;"></div>
          <div id="mailLogList" class="mail-log"></div>
        </div>
      </aside>
    </main>

    <!-- Pallino AI + Popup -->
    <button id="aiBubbleBtn" type="button" title="Apri Assistente AI">AI</button>
    <div id="aiPopup">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:6px;">
        <strong style="font-size:0.9rem;">Assistente AI UfficioCal</strong>
        <button id="closeAiBtn" type="button" class="btn btn-ghost btn-sm">✕</button>
      </div>
      <div id="aiMsgs" class="ai-msgs"></div>
      <form id="aiForm" style="display:flex;gap:6px;">
        <input id="aiInput" type="text" placeholder="Chiedi sugli impegni o alert..." style="flex:1;padding:7px 9px;border-radius:8px;border:1px solid var(--border);background:var(--card-2);color:#fff;font-size:0.84rem;" />
        <button type="submit" class="btn btn-primary btn-sm">Invia</button>
      </form>
    </div>
  </section>

  <!-- MODALE CREA / MODIFICA IMPEGNO & ALERT -->
  <div id="eventModal" class="modal-backdrop">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h3 id="eventModalTitle">Nuovo impegno &amp; Alert bot</h3>
        <button id="closeModalBtn" type="button" class="btn btn-ghost">✕</button>
      </div>
      <form id="eventForm">
        <input id="evEditId" type="hidden" />
        <div class="row-2">
          <div class="field">
            <label for="evTitle">Titolo</label>
            <input id="evTitle" type="text" placeholder="Es. Riunione fornitore" required />
          </div>
          <div class="field">
            <label for="evColor">Colore</label>
            <select id="evColor">
              <option value="blue">Blu</option>
              <option value="green">Verde</option>
              <option value="amber">Ambra</option>
              <option value="red">Rosso</option>
              <option value="purple">Viola</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="evDate">Data impegno</label>
          <input id="evDate" type="date" required />
        </div>
        <div class="row-2">
          <div class="field">
            <label for="evStart">Ora inizio</label>
            <input id="evStart" type="time" value="09:00" required />
          </div>
          <div class="field">
            <label for="evEnd">Ora fine</label>
            <input id="evEnd" type="time" value="10:00" required />
          </div>
        </div>

        <div class="field">
          <label for="evAlertCount">Numero di alert (da 1 a 10)</label>
          <select id="evAlertCount"></select>
          <div id="alertScheduleRows" class="alerts-box"></div>
        </div>

        <div class="field">
          <label>Destinatari alert</label>
          <div class="radio-row">
            <label><input type="radio" name="evRecMode" value="all" checked /> Tutti gli utenti registrati (predefinito)</label>
            <label><input type="radio" name="evRecMode" value="selected" /> Seleziona alcuni utenti</label>
          </div>
          <div id="recipientPicker" class="picker-box"></div>
        </div>

        <div class="field">
          <label for="evExtraEmails">Email extra separate da virgola (opzionale)</label>
          <input id="evExtraEmails" type="text" placeholder="altro@azienda.it" />
        </div>

        <div class="field">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input id="evSendEmailNow" type="checkbox" style="width:auto;" />
            <span>Invia subito una mail di conferma (oltre agli alert alle date e ore impostate)</span>
          </label>
        </div>

        <div id="eventFormStatus" style="font-size:0.78rem;color:#38bdf8;margin-bottom:8px;"></div>

        <div style="display:flex;gap:8px;justify-content:flex-end;">
          <button type="button" id="cancelModalBtn" class="btn btn-ghost">Annulla</button>
          <button type="submit" id="saveEventBtn" class="btn btn-primary">Salva impegno</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SHARED_PASS = 'ufficio2026';
    const SESSION_KEY = 'ufficiocal_user_v4';
    const COLOR_NAMES = { blue: 'Blu', green: 'Verde', amber: 'Ambra', red: 'Rosso', purple: 'Viola' };
    const $ = id => document.getElementById(id);

    const state = {
      user: null,
      users: [],
      events: [],
      sentEmails: [],
      view: 'month',
      cursor: new Date()
    };

    for (let n = 1; n <= 10; n++) {
      const opt = document.createElement('option');
      opt.value = String(n);
      opt.textContent = `${n} alert`;
      $('evAlertCount').appendChild(opt);
    }

    function toIso(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function addMinutesToTime(timeStr, minsToAdd) {
      const parts = String(timeStr || '09:00').split(':');
      const h = Number(parts[0] || 9);
      const m = Number(parts[1] || 0);
      const total = ((h * 60 + m + minsToAdd) % 1440 + 1440) % 1440;
      return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
    }

    function renderAlertRows(count, existingAlerts = []) {
      const box = $('alertScheduleRows');
      const nCount = Math.max(1, Math.min(10, Number(count || 1)));
      const defDate = $('evDate').value || toIso(new Date());
      const defStart = $('evStart').value || '09:00';
      box.innerHTML = '';

      for (let i = 0; i < nCount; i++) {
        const ex = existingAlerts[i] || {};
        const row = document.createElement('div');
        row.className = 'alert-row';

        const lbl = document.createElement('span');
        lbl.style.fontWeight = '700';
        lbl.textContent = `Alert #${i + 1}`;

        const dInp = document.createElement('input');
        dInp.type = 'date';
        dInp.className = 'al-date';
        dInp.value = ex.date || defDate;

        const tInp = document.createElement('input');
        tInp.type = 'time';
        tInp.className = 'al-time';
        tInp.value = ex.time || addMinutesToTime(defStart, -15 * (nCount - i));

        row.appendChild(lbl);
        row.appendChild(dInp);
        row.appendChild(tInp);
        box.appendChild(row);
      }
    }

    function collectAlertsFromForm() {
      const dates = Array.from(document.querySelectorAll('.al-date')).map(i => i.value);
      const times = Array.from(document.querySelectorAll('.al-time')).map(i => i.value);
      return dates.map((d, idx) => ({
        index: idx + 1,
        date: d || $('evDate').value || toIso(new Date()),
        time: times[idx] || $('evStart').value || '09:00',
        sentAt: null
      }));
    }

    $('evAlertCount').addEventListener('change', () => {
      renderAlertRows($('evAlertCount').value, collectAlertsFromForm());
    });

    function saveSession() {
      try {
        if (state.user && state.user.email) {
          sessionStorage.setItem(SESSION_KEY, JSON.stringify(state.user));
        } else {
          sessionStorage.removeItem(SESSION_KEY);
        }
      } catch (_) {}
    }

    function loadSession() {
      try {
        const raw = sessionStorage.getItem(SESSION_KEY);
        if (raw) {
          const u = JSON.parse(raw);
          if (u && u.email) state.user = u;
        }
      } catch (_) {}
    }

    function syncScreen() {
      saveSession();
      const logged = Boolean(state.user && state.user.email);
      $('loginScreen').classList.toggle('active', !logged);
      $('appScreen').classList.toggle('active', logged);
      $('aiBubbleBtn').classList.toggle('visible', logged);
      if (!logged) $('aiPopup').classList.remove('open');
      if (logged) {
        $('welcomeTitle').textContent = `UfficioCal — ${state.user.name || state.user.email}`;
        $('userBadge').textContent = `${state.user.email} · Attivo`;
        renderAll();
      }
    }

    async function fetchServerState() {
      try {
        const r = await fetch('/api/state', { cache: 'no-store' });
        const d = await r.json().catch(() => ({}));
        if (Array.isArray(d.users)) state.users = d.users;
        if (Array.isArray(d.events)) state.events = d.events;
        if (Array.isArray(d.sentEmails)) state.sentEmails = d.sentEmails;
        if (state.user) renderAll();
      } catch (_) {}
    }

    function getRecipientMode() {
      const el = document.querySelector('input[name="evRecMode"]:checked');
      return el ? el.value : 'all';
    }

    function renderRecipientPicker(selectedEmails = [], mode = 'all') {
      const picker = $('recipientPicker');
      const known = new Set();
      (state.users || []).forEach(u => {
        if (u && u.email) known.add(String(u.email).trim().toLowerCase());
      });
      if (state.user && state.user.email) {
        known.add(String(state.user.email).trim().toLowerCase());
      }
      const pre = new Set((selectedEmails || []).map(x => String(x).trim().toLowerCase()));
      const list = Array.from(known).filter(e => e.includes('@'));

      if (!list.length) {
        picker.innerHTML = '<div style="font-size:0.78rem;color:var(--muted);">Nessun utente registrato ancora.</div>';
        return;
      }

      picker.innerHTML = '';
      list.forEach(em => {
        const lbl = document.createElement('label');
        lbl.style.cssText = 'display:flex;align-items:center;gap:7px;font-size:0.8rem;cursor:pointer;';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.className = 'rec-cb';
        cb.value = em;
        cb.checked = mode === 'all' ? true : pre.has(em);
        cb.style.width = 'auto';
        const span = document.createElement('span');
        span.textContent = em;
        lbl.appendChild(cb);
        lbl.appendChild(span);
        picker.appendChild(lbl);
      });
    }

    document.querySelectorAll('input[name="evRecMode"]').forEach(r => {
      r.addEventListener('change', () => {
        const mode = getRecipientMode();
        document.querySelectorAll('.rec-cb').forEach(cb => {
          cb.checked = (mode === 'all');
        });
      });
    });

    function collectSelectedEmails() {
      const mode = getRecipientMode();
      const set = new Set();
      if (mode === 'all') {
        (state.users || []).forEach(u => {
          if (u && u.email) set.add(String(u.email).trim().toLowerCase());
        });
        if (state.user && state.user.email) set.add(String(state.user.email).trim().toLowerCase());
      } else {
        document.querySelectorAll('.rec-cb:checked').forEach(cb => {
          const v = String(cb.value || '').trim().toLowerCase();
          if (v) set.add(v);
        });
      }
      String($('evExtraEmails').value || '')
        .split(',')
        .map(x => x.trim().toLowerCase())
        .filter(v => v.includes('@'))
        .forEach(v => set.add(v));
      return Array.from(set);
    }

    function closeEventModal() {
      $('eventModal').classList.remove('open');
      $('saveEventBtn').disabled = false;
      $('saveEventBtn').textContent = $('evEditId').value ? 'Aggiorna impegno' : 'Salva impegno';
      $('eventFormStatus').textContent = '';
    }

    function openCreateModal(dateIso = '') {
      const dStr = dateIso || toIso(new Date());
      $('evEditId').value = '';
      $('eventModalTitle').textContent = 'Nuovo impegno & Alert bot';
      $('saveEventBtn').disabled = false;
      $('saveEventBtn').textContent = 'Salva impegno';
      $('eventForm').reset();
      $('evDate').value = dStr;
      $('evStart').value = '09:00';
      $('evEnd').value = '10:00';
      $('evAlertCount').value = '1';
      $('evSendEmailNow').checked = false;
      $('eventFormStatus').textContent = '';
      const allRadio = document.querySelector('input[name="evRecMode"][value="all"]');
      if (allRadio) allRadio.checked = true;
      renderAlertRows(1, [{ date: dStr, time: '08:45' }]);
      renderRecipientPicker([], 'all');
      $('eventModal').classList.add('open');
    }

    function openEditModal(ev) {
      const mode = ev.recipientMode === 'selected' ? 'selected' : 'all';
      const existingAlerts = Array.isArray(ev.alerts) && ev.alerts.length
        ? ev.alerts
        : [{ date: ev.alertDate || ev.date, time: ev.alertTime || ev.startTime }];
      $('evEditId').value = ev.id;
      $('eventModalTitle').textContent = 'Modifica impegno & Alert';
      $('saveEventBtn').disabled = false;
      $('saveEventBtn').textContent = 'Aggiorna impegno';
      $('evTitle').value = ev.title || '';
      $('evColor').value = ev.color || 'blue';
      $('evDate').value = ev.date || toIso(new Date());
      $('evStart').value = ev.startTime || '09:00';
      $('evEnd').value = ev.endTime || '10:00';
      $('evAlertCount').value = String(existingAlerts.length);
      $('evExtraEmails').value = '';
      $('evSendEmailNow').checked = false;
      $('eventFormStatus').textContent = '';
      const mRadio = document.querySelector(`input[name="evRecMode"][value="${mode}"]`);
      if (mRadio) mRadio.checked = true;
      renderAlertRows(existingAlerts.length, existingAlerts);
      renderRecipientPicker(Array.isArray(ev.emails) ? ev.emails : [], mode);
      $('eventModal').classList.add('open');
    }

    async function deleteEvent(evId) {
      const cleanId = String(evId || '').trim();
      if (!cleanId) return;
      try {
        let r = await fetch('/api/events/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          cache: 'no-store',
          body: JSON.stringify({ id: cleanId })
        });
        let j = await r.json().catch(() => ({}));
        if (!r.ok || !j.ok) {
          r = await fetch('/api/events/' + encodeURIComponent(cleanId), {
            method: 'DELETE',
            cache: 'no-store'
          });
          j = await r.json().catch(() => ({}));
        }
        if (r.ok && j.ok) {
          state.events = Array.isArray(j.events)
            ? j.events
            : state.events.filter(e => String(e.id) !== cleanId);
          renderAll();
        }
      } catch (_) {}
    }

    function renderCalendar() {
      const grid = $('calGrid');
      grid.innerHTML = '';
      ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'].forEach(d => {
        const el = document.createElement('div');
        el.className = 'dow';
        el.textContent = d;
        grid.appendChild(el);
      });

      const todayIso = toIso(new Date());
      const cur = new Date(state.cursor);
      let days = [];

      if (state.view === 'month') {
        $('periodLabel').textContent = cur.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });
        const first = new Date(cur.getFullYear(), cur.getMonth(), 1);
        const last = new Date(cur.getFullYear(), cur.getMonth() + 1, 0);
        const offset = (first.getDay() + 6) % 7;
        for (let i = 0; i < offset; i++) days.push(null);
        for (let d = 1; d <= last.getDate(); d++) {
          days.push(new Date(cur.getFullYear(), cur.getMonth(), d));
        }
      } else {
        const offset = (cur.getDay() + 6) % 7;
        const mon = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() - offset);
        const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
        $('periodLabel').textContent = `${mon.toLocaleDateString('it-IT', { day: '2-digit', month: 'short' })} - ${sun.toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric' })}`;
        for (let i = 0; i < 7; i++) {
          days.push(new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i));
        }
      }

      days.forEach(dt => {
        const cell = document.createElement('div');
        if (!dt) {
          cell.className = 'day-cell empty';
          grid.appendChild(cell);
          return;
        }
        const iso = toIso(dt);
        cell.className = 'day-cell' + (iso === todayIso ? ' today' : '');

        const num = document.createElement('div');
        num.className = 'day-num';
        num.textContent = String(dt.getDate());
        cell.appendChild(num);

        const dayEvents = (state.events || []).filter(ev => ev && ev.date === iso);
        dayEvents.forEach(ev => {
          const badge = document.createElement('div');
          badge.className = 'ev-badge ' + (ev.color || 'blue');

          const label = document.createElement('span');
          label.style.cssText = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;';
          label.textContent = `${ev.startTime || ''} ${ev.title || ''}`.trim();
          label.addEventListener('click', (e) => {
            e.stopPropagation();
            openEditModal(ev);
          });

          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'ev-del-mini';
          delBtn.textContent = '✕';
          delBtn.title = 'Elimina impegno';
          delBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            delBtn.disabled = true;
            await deleteEvent(ev.id);
          });

          badge.appendChild(label);
          badge.appendChild(delBtn);
          cell.appendChild(badge);
        });

        cell.addEventListener('click', () => openCreateModal(iso));
        grid.appendChild(cell);
      });
    }

    function renderEventsList() {
      const list = $('eventsList');
      const events = Array.isArray(state.events) ? state.events : [];
      $('eventsCount').textContent = String(events.length);
      list.innerHTML = '';

      if (!events.length) {
        list.innerHTML = '<div style="font-size:0.84rem;color:var(--muted);">Nessun impegno salvato.</div>';
        return;
      }

      events.forEach(ev => {
        const row = document.createElement('div');
        row.className = 'event-item';

        const info = document.createElement('div');
        const alList = Array.isArray(ev.alerts) && ev.alerts.length
          ? ev.alerts.map(a => `${a.date} ${a.time}`).join(', ')
          : (ev.alertDate ? `${ev.alertDate} ${ev.alertTime || ''}` : '');
        const colName = COLOR_NAMES[ev.color] || ev.color || 'Blu';
        info.innerHTML = `<div class="event-item-title">${ev.title || 'Impegno'} (${colName})</div><div class="event-item-meta">${ev.date || ''} · ${ev.startTime || ''}-${ev.endTime || ''}${alList ? ' · Alert: ' + alList : ''}</div>`;

        const actions = document.createElement('div');
        actions.className = 'event-actions';

        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'btn btn-primary btn-sm';
        editBtn.textContent = 'Modifica';
        editBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          openEditModal(ev);
        });

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'btn btn-danger btn-sm';
        delBtn.textContent = 'Elimina';
        delBtn.addEventListener('click', async (e) => {
          e.stopPropagation();
          delBtn.disabled = true;
          delBtn.textContent = '...';
          await deleteEvent(ev.id);
        });

        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        row.appendChild(info);
        row.appendChild(actions);
        list.appendChild(row);
      });
    }

    function renderMailLog() {
      const box = $('mailLogList');
      const mails = Array.isArray(state.sentEmails) ? state.sentEmails.slice(0, 6) : [];
      box.innerHTML = '';
      if (!mails.length) {
        box.innerHTML = '<div class="mail-row">Nessuna email inviata finora.</div>';
        return;
      }
      mails.forEach(m => {
        const d = document.createElement('div');
        d.className = 'mail-row';
        const when = m.sentAt ? new Date(m.sentAt).toLocaleString('it-IT') : '';
        d.textContent = `${m.subject || 'Avviso'} → ${(m.to || []).join(', ')} (${when})`;
        box.appendChild(d);
      });
    }

    function renderAll() {
      renderCalendar();
      renderEventsList();
      renderMailLog();
    }

    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pass = $('loginPass').value.trim();
      if (pass !== SHARED_PASS) {
        alert('Password condivisa non valida.');
        return;
      }
      const email = $('loginEmail').value.trim().toLowerCase();
      const name = $('loginName').value.trim() || email.split('@')[0];
      state.user = { email, name };
      if (!state.users.some(u => String(u.email || '').toLowerCase() === email)) {
        state.users.push({ email, name });
      }
      syncScreen();
      await fetch('/api/state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ activeUser: state.user })
      }).catch(() => {});
      await fetchServerState();
    });

    $('logoutBtn').addEventListener('click', () => {
      state.user = null;
      syncScreen();
    });

    $('todayBtn').addEventListener('click', () => { state.cursor = new Date(); renderCalendar(); });
    $('monthBtn').addEventListener('click', () => { state.view = 'month'; renderCalendar(); });
    $('weekBtn').addEventListener('click', () => { state.view = 'week'; renderCalendar(); });
    $('prevBtn').addEventListener('click', () => {
      state.cursor = state.view === 'month'
        ? new Date(state.cursor.getFullYear(), state.cursor.getMonth() - 1, 1)
        : new Date(state.cursor.getFullYear(), state.cursor.getMonth(), state.cursor.getDate() - 7);
      renderCalendar();
    });
    $('nextBtn').addEventListener('click', () => {
      state.cursor = state.view === 'month'
        ? new Date(state.cursor.getFullYear(), state.cursor.getMonth() + 1, 1)
        : new Date(state.cursor.getFullYear(), state.cursor.getMonth(), state.cursor.getDate() + 7);
      renderCalendar();
    });

    $('openNewEventBtn').addEventListener('click', () => openCreateModal(toIso(new Date())));
    $('closeModalBtn').addEventListener('click', closeEventModal);
    $('cancelModalBtn').addEventListener('click', closeEventModal);

    $('eventForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const editId = String($('evEditId').value || '').trim();
      const recipientMode = getRecipientMode();
      const emails = collectSelectedEmails();
      const alerts = collectAlertsFromForm();
      const sendNowChecked = $('evSendEmailNow').checked;
      const siteUrl = window.location.origin;

      $('saveEventBtn').disabled = true;
      $('saveEventBtn').textContent = 'Salvataggio...';
      $('eventFormStatus').style.color = '#38bdf8';
      $('eventFormStatus').textContent = 'Salvataggio impegno in corso...';

      const payload = {
        id: editId || ('ev_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6)),
        title: $('evTitle').value.trim(),
        date: $('evDate').value,
        startTime: $('evStart').value,
        endTime: $('evEnd').value,
        color: $('evColor').value,
        alertDate: alerts[0]?.date || $('evDate').value,
        alertTime: alerts[0]?.time || $('evStart').value,
        alertCount: alerts.length,
        alerts,
        recipientMode,
        emails,
        createdBy: state.user?.email || ''
      };

      const url = editId ? '/api/events/' + encodeURIComponent(editId) : '/api/events';
      const method = editId ? 'PUT' : 'POST';

      try {
        const resp = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await resp.json().catch(() => ({}));

        if (!resp.ok || !data.ok) {
          $('saveEventBtn').disabled = false;
          $('saveEventBtn').textContent = editId ? 'Aggiorna impegno' : 'Salva impegno';
          $('eventFormStatus').style.color = '#f87171';
          $('eventFormStatus').textContent = data.error || 'Errore salvataggio impegno';
          return;
        }

        state.events = Array.isArray(data.events)
          ? data.events
          : (editId ? state.events.map(x => String(x.id) === editId ? payload : x) : [payload, ...state.events]);

        closeEventModal();
        renderAll();

        if (sendNowChecked) {
          const colorLabel = COLOR_NAMES[payload.color] || payload.color;
          fetch('/api/send-email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              to: emails,
              recipientMode,
              subject: `${editId ? 'Aggiornamento impegno' : 'Nuovo impegno'}: ${payload.title}`,
              eventTitle: payload.title,
              color: colorLabel,
              siteUrl,
              html: `<p><strong>${payload.title}</strong> — Data: ${payload.date} (${payload.startTime} - ${payload.endTime})</p><p>Alert impostati: ${alerts.map(a => a.date + ' ' + a.time).join(', ')}</p>`
            })
          })
            .then(r => r.json().catch(() => ({})))
            .then(mailJson => {
              if (Array.isArray(mailJson.sentEmails)) {
                state.sentEmails = mailJson.sentEmails;
                renderMailLog();
              }
            })
            .catch(() => {});
        }
      } catch (err) {
        $('saveEventBtn').disabled = false;
        $('saveEventBtn').textContent = editId ? 'Aggiorna impegno' : 'Salva impegno';
        $('eventFormStatus').style.color = '#f87171';
        $('eventFormStatus').textContent = 'Errore rete: ' + err.message;
      }
    });

    $('quickMailForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const modeEl = document.querySelector('input[name="qmMode"]:checked');
      const qmMode = modeEl ? modeEl.value : 'all';
      const to = $('quickMailTo').value.split(',').map(x => x.trim().toLowerCase()).filter(Boolean);
      const subject = $('quickMailSubject').value.trim() || 'Avviso UfficioCal';
      const text = $('quickMailBody').value.trim() || 'Notifica inviata da UfficioCal.';
      const st = $('quickMailStatus');
      st.style.color = '#fbbf24';
      st.textContent = 'Invio in corso...';

      try {
        const r = await fetch('/api/send-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            to,
            recipientMode: qmMode,
            subject,
            text,
            siteUrl: window.location.origin,
            html: `<p>${text}</p>`
          })
        });
        const j = await r.json().catch(() => ({}));
        if (r.ok && j.ok) {
          if (Array.isArray(j.sentEmails)) state.sentEmails = j.sentEmails;
          renderMailLog();
          st.style.color = '#4ade80';
          st.textContent = `Email inviata a: ${(j.record?.to || []).join(', ')}`;
          $('quickMailForm').reset();
        } else {
          st.style.color = '#f87171';
          st.textContent = j.error || 'Errore invio email.';
        }
      } catch (err) {
        st.style.color = '#f87171';
        st.textContent = 'Errore rete: ' + err.message;
      }
    });

    $('aiBubbleBtn').addEventListener('click', () => {
      $('aiPopup').classList.toggle('open');
    });
    $('closeAiBtn').addEventListener('click', () => {
      $('aiPopup').classList.remove('open');
    });

    $('aiForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = $('aiInput').value.trim();
      if (!text) return;
      $('aiInput').value = '';

      const uDiv = document.createElement('div');
      uDiv.className = 'ai-msg user';
      uDiv.textContent = text;
      $('aiMsgs').appendChild(uDiv);

      const bDiv = document.createElement('div');
      bDiv.className = 'ai-msg bot';
      bDiv.textContent = 'Sto pensando...';
      $('aiMsgs').appendChild(bDiv);
      $('aiMsgs').scrollTop = $('aiMsgs').scrollHeight;

      const sys = `Sei l'assistente AI di UfficioCal. Utente attivo: ${state.user?.name || ''} (${state.user?.email || ''}). Data: ${new Date().toLocaleDateString('it-IT')}. Regole: NON usare mai tabelle con '|', NON usare '**', scrivi solo testo semplice con righe separate e trattini '- '. Dati: ${JSON.stringify({ users: state.users, events: state.events, sentEmails: (state.sentEmails || []).slice(0, 15) })}`;

      try {
        const r = await fetch('/api/ai', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text, systemInstruction: sys })
        });
        const j = await r.json().catch(() => ({}));
        bDiv.textContent = j.reply || j.error || 'Nessuna risposta.';
      } catch (err) {
        bDiv.textContent = 'Errore AI: ' + err.message;
      }
      $('aiMsgs').scrollTop = $('aiMsgs').scrollHeight;
    });

    loadSession();
    syncScreen();
    fetchServerState();
    setInterval(fetchServerState, 15000);
  </script>
</body>
</html>
